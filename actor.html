<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devendra's Actor Guessing Game</title>
</head>
<body>
    <h1>Actors by Devendra Derangula</h1>

    <form>
        <label for="secretActor">Peter Pan</label>
        <input type="password" id="secretActor" value="Robin Williams">
        <br><br>

        <label for="actorGuess">Who is the actor</label>
        <input type="text" id="actorGuess">
        <br><br>

        <input type="button"
               value="Check the guess"
               onclick="checkActor()">
    </form>

    <div id="actorResults">Correct: 0; Not correct: 0</div>

    <script>
        let correct = 0;
        let notCorrect = 0;
        let usePic = 1;

        function checkActor() {
            let secret = document.getElementById("secretActor").value;
            let guess = document.getElementById("actorGuess").value;

            if (secret === guess) {
                correct++;
                alert("That's right");
            } else {
                notCorrect++;
                alert("Better luck next time");
            }

            document.getElementById("actorResults").innerHTML =
                "Correct: " + correct + "; Not correct: " + notCorrect;
        }
        function updatePic() {
            switch(usePic) {
                case 1:
                document.getElementById("foodImage").src = "nachos.jpg";
                usePic = 2;
                break;

                case 2:
                document.getElementById("foodImage").src = "ramen.jpg";
                usePic = 3;
                break;

                case 3:
                document.getElementById("foodImage").src = "dosa.jpg";
                usePic = 1;
                break;
            }
        }   
    </script>

    <div>
    <img id="foodImage" src="dosa.jpg" width="150" height="150" onclick="updatePic()">
</div>
</body>
</html>
