<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Devendra's Actor Guessing Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-4">
            Actors by Devendra Derangula
        </h1>

        <form>

            <div class="mb-3">
                <label for="secretActor" class="form-label">
                    Peter Pan
                </label>

                <input type="password"
                       class="form-control"
                       id="secretActor"
                       value="Robin Williams">
            </div>

            <div class="mb-3">
                <label for="actorGuess" class="form-label">
                    Who is the actor?
                </label>

                <input type="text"
                       class="form-control"
                       id="actorGuess">
            </div>

            <input type="button"
                   class="btn btn-primary"
                   value="Check the guess"
                   onclick="checkActor()"
                   id="guessButton">

        </form>

        <div id="actorResults"
             class="alert alert-info mt-3">
            Correct: 0; Not correct: 0
        </div>

        <hr>

        <h3 class="mb-3">Food Gallery</h3>

        <p>Click the image to change it.</p>

        <div>
            <img id="foodImage"
                 src="dosa.jpg"
                 width="150"
                 height="150"
                 class="rounded shadow"
                 onclick="updatePic()"
                 alt="Food">
        </div>

    </div>

</div>

<script>

    let correct = 0;
    let notCorrect = 0;
    let usePic = 1;


    function checkActor() {

        let secret =
            document.getElementById("secretActor").value;

        let guess =
            document.getElementById("actorGuess").value;


        if (secret === guess) {

            correct++;

            alert("That's right");

        } else {

            notCorrect++;

            alert("Better luck next time");
        }


        document.getElementById("actorResults").innerHTML =
            "Correct: " + correct +
            "; Not correct: " + notCorrect;


        if (notCorrect > 10) {

            document.getElementById("foodImage").onclick =
                tooManyWrong;
        }
    }


    function updatePic() {

        switch(usePic) {

            case 1:

                document.getElementById("foodImage").src =
                    "nachos.jpg";

                usePic = 2;

                break;


            case 2:

                document.getElementById("foodImage").src =
                    "ramen.jpg";

                usePic = 3;

                break;


            case 3:

                document.getElementById("foodImage").src =
                    "dosa.jpg";

                usePic = 1;

                break;
        }
    }


    function tooManyWrong() {

        alert("Sorry, too many wrong guesses.");
    }

</script>

</body>
