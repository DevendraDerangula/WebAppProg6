<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devendra's Meal Planner</title>
</head>

<body>

    <h1>Devendra Derangula meal planner</h1>

    <form>
        <input type="checkbox"
               id="breakfast"
               value="True">
        <label for="breakfast">Breakfast</label>
        <br>

        <input type="checkbox"
               id="lunch"
               value="False">
        <label for="lunch">Lunch</label>
        <br>

        <input type="checkbox"
               id="dinner"
               value="True">
        <label for="dinner">Dinner</label>
        <br><br>

        <input type="button"
               value="Meal Plan Choices"
               onclick="choices()">
    </form>

    <p id="mealResults"></p>

    <script>
        let my_meal_plan = {};

        function choices() {
            my_meal_plan = {};

            my_meal_plan.breakfast =
                document.getElementById("breakfast").checked;

            my_meal_plan.lunch =
                document.getElementById("lunch").checked;

            my_meal_plan.dinner =
                document.getElementById("dinner").checked;

            document.getElementById("mealResults").innerHTML =
                "Breakfast: " + my_meal_plan.breakfast +
                "; Lunch: " + my_meal_plan.lunch +
                "; Dinner: " + my_meal_plan.dinner;
        }
    </script>

</body>

</html>
